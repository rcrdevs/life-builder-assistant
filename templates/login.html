{% extends "base.html" %}
{% block title %}Life Builder — Entrar{% endblock %}
{% block content %}
<section class="lb-onboard lb-auth">
    <p class="lb-eyebrow">Acesso</p>
    <h1 class="lb-title">Entrar no seu Life Build.</h1>
    <p class="lb-lede">Seu progresso, missões e build ficam salvos na sua conta.</p>

    {% if erro %}<p class="lb-error">{{ erro }}</p>{% endif %}

    <form method="post" action="{{ url_for('login') }}" class="lb-form">
        <label class="lb-field">
            <span>E-mail</span>
            <input type="email" name="email" required autofocus>
        </label>
        <label class="lb-field">
            <span>Senha</span>
            <input type="password" name="password" required>
        </label>
        <button type="submit" class="lb-btn lb-btn--primary">Entrar →</button>
    </form>

    <p class="lb-auth__switch">Ainda não tem conta? <a href="{{ url_for('register') }}">Criar conta</a></p>
</section>
{% endblock %}
