<svg id="statue-svg" viewBox="0 0 220 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="lb-glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="2.4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <polygon points="30,296 190,296 175,268 45,268" fill="#0A0F16" stroke="#2F7BFF" stroke-width="1" opacity="0.9"/>
    <text x="110" y="286" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10"
          fill="#6FA8FF" letter-spacing="2" style="text-transform:uppercase">{{ user.nome[:16] if user and user.nome else 'HERÓI(ÍNA)' }}</text>

    <polygon id="aura" points="110,18 147,44 147,96 110,122 73,96 73,44" fill="none" stroke="#2F7BFF" stroke-width="1.4" opacity="0" filter="url(#lb-glow)"/>

    <polygon id="arm-left" class="lb-limb" points="60,130 74,128 78,197 62,200" fill="#0A0F16" stroke="#2F7BFF" stroke-width="1.5"/>
    <polygon id="arm-right" class="lb-limb" points="146,128 160,130 158,200 142,197" fill="#0A0F16" stroke="#2F7BFF" stroke-width="1.5"/>

    <polygon id="leg-left" class="lb-limb" points="70,268 100,268 96,190 74,190" fill="#0A0F16" stroke="#2F7BFF" stroke-width="1.5"/>
    <polygon id="leg-right" class="lb-limb" points="120,268 150,268 146,190 124,190" fill="#0A0F16" stroke="#2F7BFF" stroke-width="1.5"/>

    <polygon id="torso" points="72,190 148,190 138,110 82,110" fill="#0A0F16" stroke="#2F7BFF" stroke-width="2"/>

    <polygon id="head" points="110,40 128,52 128,80 110,95 92,80 92,52" fill="#0A0F16" stroke="#2F7BFF" stroke-width="2"/>

    <polygon id="beard" points="98,82 122,82 115,106 105,106" fill="#0A0F16" stroke="#2F7BFF" stroke-width="1" opacity="0"/>

    <polygon id="glint" points="110,58 115,64 110,70 105,64" fill="#6FA8FF" opacity="0" filter="url(#lb-glow)"/>
</svg>
