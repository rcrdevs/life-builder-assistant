<dialog id="outro-dialog" class="lb-dialog">
    <div class="lb-dialog__body">
        <p class="lb-dialog__title">Descreva o que você tem em mente</p>
        <input type="text" id="outro-dialog-input" class="lb-dialog__input" placeholder="Escreva aqui..." maxlength="80">
        <div class="lb-dialog__actions">
            <button type="button" class="lb-btn lb-btn--ghost lb-btn--sm" id="outro-dialog-cancel">Cancelar</button>
            <button type="button" class="lb-btn lb-btn--primary lb-btn--sm" id="outro-dialog-confirm">Confirmar</button>
        </div>
    </div>
</dialog>
