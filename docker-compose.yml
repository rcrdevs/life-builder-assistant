services:
  life-builder:
    build: .
    image: life-builder:latest
    container_name: life-builder
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no arquivo .env — veja .env.example}
      DB_HOST: ${DB_HOST:?defina DB_HOST no arquivo .env — veja .env.example}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:?defina DB_USER no arquivo .env — veja .env.example}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-life_builder}
      DB_SSL: ${DB_SSL:-1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
